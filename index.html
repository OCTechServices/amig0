<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amig0 — CRM</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Auth Gate -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1 class="login-title">amig0</h1>
      <p class="login-subtitle">Operator Portal</p>
      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
        <button type="submit" id="login-btn" class="btn btn-primary btn-full">Sign In</button>
        <button type="button" id="forgot-btn" class="btn-forgot">Forgot password?</button>
      </form>
    </div>
  </div>

  <!-- App Shell — hidden until authenticated -->
  <div id="app-shell" class="app-shell hidden">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">Amig<svg class="brand-zero" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 26" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10,1.5 C14.97,1.5 19,6.65 19,13 C19,19.35 14.97,24.5 10,24.5 C5.03,24.5 1,19.35 1,13 C1,6.65 5.03,1.5 10,1.5 Z M10,7 C7.51,7 5.5,9.69 5.5,13 C5.5,16.31 7.51,19 10,19 C12.49,19 14.5,16.31 14.5,13 C14.5,9.69 12.49,7 10,7 Z"/><line x1="6.5" y1="21" x2="13.5" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/></svg></span>
        <span class="sidebar-tagline" id="sidebar-tagline">Travel CRM</span>
      </div>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <ul>
          <li>
            <a href="#" class="nav-link active" data-section="dashboard">
              <span class="nav-icon">&#9783;</span>
              Dashboard
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="clients">
              <span class="nav-icon">&#9786;</span>
              Clients
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="tours">
              <span class="nav-icon">&#9788;</span>
              <span class="nav-label" data-cfg="tours">Tours</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="passengers">
              <span class="nav-icon">&#9757;</span>
              <span class="nav-label" data-cfg="passengers">Passengers</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="bookings">
              <span class="nav-icon">&#9875;</span>
              <span class="nav-label" data-cfg="bookings">Bookings</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="quotes">
              <span class="nav-icon">&#9998;</span>
              Quotes
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="invoicing">
              <span class="nav-icon">&#9776;</span>
              Invoicing
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="providers">
              <span class="nav-icon">&#9881;</span>
              <span class="nav-label" data-cfg="providers">Providers</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="guides">
              <span class="nav-icon">&#9873;</span>
              <span class="nav-label" data-cfg="guides">Guides</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="briefings">
              <span class="nav-icon">&#9741;</span>
              <span class="nav-label" data-cfg="briefings">Briefings</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="partners">
              <span class="nav-icon">&#9733;</span>
              Partners
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="marketplace">
              <span class="nav-icon">&#9741;</span>
              Marketplace
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="invites">
              <span class="nav-icon">&#9993;</span>
              Invites
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="operators">
              <span class="nav-icon">&#9670;</span>
              Operators
            </a>
          </li>
          <li>
            <a href="#" class="nav-link" data-section="reports">
              <span class="nav-icon">&#9636;</span>
              Reports
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <span id="user-email" class="sidebar-user-email"></span>
        <button id="sign-out-btn" class="btn btn-ghost-light btn-full">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="topbar">
        <h2 id="section-title" class="topbar-title">Dashboard</h2>
      </header>
      <main id="content-area" class="content-area">
        <!-- Injected by section modules -->
      </main>
    </div>

  </div>

  <!-- Firebase compat SDK v10.12 — load order matters -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>

  <!-- App config — gitignored, never committed -->
  <script src="firebase-config.js"></script>

  <!-- Instance config — branding, labels, locale -->
  <script src="config.js"></script>

  <!-- PDF generation -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- App modules -->
  <script src="js/pdf.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/clients.js"></script>
  <script src="js/tours.js"></script>
  <script src="js/passengers.js"></script>
  <script src="js/bookings.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/invoicing.js"></script>
  <script src="js/providers.js"></script>
  <script src="js/partners.js"></script>
  <script src="js/marketplace.js"></script>
  <script src="js/invites.js"></script>
  <script src="js/guides.js"></script>
  <script src="js/briefings.js"></script>
  <script src="js/operators.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/nav.js"></script>

</body>
</html>
