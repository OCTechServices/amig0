<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amig0 Travel — My Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body>

  <!-- Auth Gate -->
  <div id="portal-login" class="portal-login">
    <div class="portal-login-inner">
      <div class="portal-brand">
        <span class="portal-brand-name">Amig<svg class="brand-zero" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 26" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10,1.5 C14.97,1.5 19,6.65 19,13 C19,19.35 14.97,24.5 10,24.5 C5.03,24.5 1,19.35 1,13 C1,6.65 5.03,1.5 10,1.5 Z M10,7 C7.51,7 5.5,9.69 5.5,13 C5.5,16.31 7.51,19 10,19 C12.49,19 14.5,16.31 14.5,13 C14.5,9.69 12.49,7 10,7 Z"/><line x1="6.5" y1="21" x2="13.5" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/></svg></span>
        <span class="portal-brand-sub">Travel</span>
      </div>
      <h1 class="portal-login-title">My Trip Portal</h1>
      <p class="portal-login-sub">Sign in to view your bookings and itinerary.</p>
      <form id="portal-login-form" class="portal-form" novalidate>
        <div class="pfield">
          <label for="p-email">Email</label>
          <input type="email" id="p-email" placeholder="your@email.com" autocomplete="email" required>
        </div>
        <div class="pfield">
          <label for="p-password">Password</label>
          <input type="password" id="p-password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <p id="portal-login-error" class="portal-error" role="alert" aria-live="polite"></p>
        <button type="submit" id="portal-login-btn" class="pbtn pbtn-primary pbtn-full">Sign In</button>
        <button type="button" id="portal-forgot-btn" class="btn-forgot">Forgot password?</button>
      </form>
    </div>
  </div>

  <!-- Portal Shell -->
  <div id="portal-shell" class="portal-shell hidden">

    <!-- Top Nav -->
    <header class="portal-nav">
      <div class="portal-nav-brand">
        <span class="portal-nav-logo">Amig<svg class="brand-zero" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 26" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10,1.5 C14.97,1.5 19,6.65 19,13 C19,19.35 14.97,24.5 10,24.5 C5.03,24.5 1,19.35 1,13 C1,6.65 5.03,1.5 10,1.5 Z M10,7 C7.51,7 5.5,9.69 5.5,13 C5.5,16.31 7.51,19 10,19 C12.49,19 14.5,16.31 14.5,13 C14.5,9.69 12.49,7 10,7 Z"/><line x1="6.5" y1="21" x2="13.5" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/></svg></span>
      </div>
      <nav class="portal-nav-links">
        <a href="#" class="pnav-link active" data-section="overview">My Trip</a>
        <a href="#" class="pnav-link" data-section="itinerary">Itinerary</a>
        <a href="#" class="pnav-link" data-section="quotes">Quotes</a>
        <a href="#" class="pnav-link" data-section="invoices">Invoices</a>
        <a href="#" class="pnav-link" data-section="perks">Perks</a>
        <a href="#" class="pnav-link" data-section="map">Map</a>
        <a href="#" class="pnav-link" data-section="marketplace">Marketplace</a>
      </nav>
      <div class="portal-nav-right">
        <span id="portal-client-name" class="portal-greeting"></span>
        <button id="portal-sign-out" class="pbtn pbtn-ghost-sm">Sign Out</button>
      </div>
    </header>

    <!-- Content -->
    <main id="portal-content" class="portal-content">
      <!-- Injected by section modules -->
    </main>

  </div>

  <!-- Firebase compat SDK v10.12 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App config — gitignored -->
  <script src="firebase-config.js"></script>

  <!-- Portal modules -->
  <script src="js/portal-auth.js"></script>
  <script src="js/portal-overview.js"></script>
  <script src="js/portal-itinerary.js"></script>
  <script src="js/portal-quotes.js"></script>
  <script src="js/portal-invoices.js"></script>
  <script src="js/portal-perks.js"></script>
  <script src="js/portal-map.js"></script>
  <script src="js/portal-marketplace.js"></script>
  <script src="js/portal-nav.js"></script>

  <!-- Leaflet JS — loaded after app modules so L is available when map tab opens -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WPeM=" crossorigin=""></script>

</body>
</html>
